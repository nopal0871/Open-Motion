<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <title>Open Motion V5.283 — Community Keyboard Shortcuts</title>
    <!-- CSS dipisahkan ke file eksternal -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        
        <!-- ========================================== -->
        <!-- FITUR GANTI FOTO (Ditambahkan & Dioptimalkan) -->
        <!-- ========================================== -->
        <div class="photo-upload-section" style="padding: 20px; background: #1a1d2d; border-radius: 12px; margin: 20px; text-align: center;">
            <h3>Ubah Foto/Thumbnail</h3>
            <div class="projectThumb hasThumb" style="margin: 0 auto 15px; width: 120px; height: 120px;">
                <img id="photo-preview" src="https://via.placeholder.com/120" alt="Preview" class="projectThumbImg" style="opacity: 1; border-radius: 12px; object-fit: cover; width: 100%; height: 100%;">
            </div>
            <input type="file" id="photo-upload-input" accept="image/*" style="display: none;">
            <button onclick="document.getElementById('photo-upload-input').click()" style="padding: 8px 16px; background: #00d7a7; color: #10121d; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
                Pilih Foto
            </button>
        </div>
        <!-- ========================================== -->

        <!-- Konten HTML utama dari index_2.txt (Home, Modal, Editor, dll) dipindahkan ke sini -->
        <section id="home" class="home simpleHome">
            <!-- Struktur asli Open Motion dilanjutkan di sini... -->
        </section>
    </div>

    <!-- JavaScript dipisahkan ke file eksternal -->
    <script src="script.js"></script>
</body>
</html>
